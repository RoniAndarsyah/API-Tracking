<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Tracking D4TI</title>
<meta name="description" content="Daftar, masuk, dan kelola pengiriman di dashboard simulasi API Tracking D4TI.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231B3FE0'/%3E%3Cpath fill='%23fff' d='M7 8h3v16H7zM12 8h1.5v16H12zM15.5 8H20v16h-4.5z'/%3E%3Cpath fill='%23FFD60A' d='M22 8h3v16h-3z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Overpass+Mono:wght@400;500;600;700&family=Overpass:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --ink: #0E1A3A;
  --ink-2: #434E6B;
  --ink-3: #626D8A;
  --paper: #FFFFFF;
  --mist: #F2F4FA;
  --line: #DCE1EE;
  --field: #AEB7CF;
  --cobalt: #1B3FE0;
  --cobalt-deep: #142FB0;
  --cobalt-soft: #E9EDFE;
  --hivis: #FFD60A;
  --hivis-soft: #FFF5B8;
  --get: #1B6AD0;    --get-bg: #E9F2FE;
  --post: #0A7F57;   --post-bg: #E6F6EF;
  --put: #AD5B00;    --put-bg: #FDF1E1;
  --delete: #CE2437; --delete-bg: #FDEAEC;
  --display: "Overpass", "Segoe UI", system-ui, sans-serif;
  --body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --mono: "Overpass Mono", ui-monospace, Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--mist); color: var(--ink); font: 400 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ol, ul, pre, table, dl, dd { margin: 0; padding: 0; }
ol, ul { list-style: none; }
a { color: var(--cobalt); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
code { font-family: var(--mono); font-size: .92em; }
:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; border-radius: 4px; }
h1:focus { outline: none; }
[hidden] { display: none !important; }

.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
.brand svg { width: 32px; height: 32px; flex: none; }
.brand-name { font: 900 19px/1 var(--display); letter-spacing: -.02em; padding-top: 3px; white-space: nowrap; }
.brand-name span { color: var(--cobalt); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px;
  background: #fff; border: 1px solid var(--field); border-radius: 8px;
  font: 600 15px/1 var(--body); color: var(--ink); text-decoration: none; white-space: nowrap;
  transition: background-color .15s, border-color .15s;
}
.btn:hover { border-color: var(--cobalt); }
.btn-primary { background: var(--cobalt); border-color: var(--cobalt); color: #fff; }
.btn-primary:hover { background: var(--cobalt-deep); border-color: var(--cobalt-deep); }
.btn-danger { background: var(--delete); border-color: var(--delete); color: #fff; }
.btn-danger:hover { background: #AD1B2C; border-color: #AD1B2C; }
.btn-block { width: 100%; }
.btn-text { background: none; border: 0; padding: 4px 0; color: var(--ink-2); font-weight: 500; font-size: 14.5px; text-decoration: underline; text-underline-offset: 3px; }
.btn-text:hover { color: var(--cobalt); }

.field { display: block; margin-bottom: 16px; }
.field-label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14.5px; }
.input {
  width: 100%; height: 46px; padding: 0 13px;
  background: #fff; border: 1px solid var(--field); border-radius: 8px;
}
.input:focus-visible { outline-offset: 0; border-color: var(--cobalt); }
.input[aria-invalid="true"] { border-color: var(--delete); }
.field-error { margin-top: 5px; color: var(--delete); font-size: 14px; line-height: 1.35; }
.password { position: relative; }
.password .input { padding-right: 88px; }
.password button {
  position: absolute; right: 6px; top: 6px; height: 34px; padding: 0 10px;
  background: none; border: 0; border-radius: 6px;
  color: var(--cobalt); font-weight: 600; font-size: 14px;
}
.form-error { margin-bottom: 16px; padding: 10px 12px; background: var(--delete-bg); border-radius: 8px; color: #9E1626; font-size: 15px; line-height: 1.4; }
.form-note { margin-bottom: 16px; padding: 10px 12px; background: var(--hivis-soft); border-radius: 8px; font-size: 15px; line-height: 1.4; }

/* Halaman masuk dan daftar: kartu lembar resi */
.auth { min-height: 100vh; min-height: 100dvh; display: grid; justify-items: center; align-content: center; gap: 22px; padding: 32px 16px; }
.auth-top { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.auth-top a:last-child { font-size: 15px; font-weight: 500; text-decoration: none; }
.waybill { width: 100%; max-width: 440px; filter: drop-shadow(0 0 1px rgba(14, 26, 58, .42)) drop-shadow(0 18px 28px rgba(14, 26, 58, .11)); }
.waybill-top, .waybill-stub { background: var(--paper); --notch: 11px; }
.waybill-top {
  padding: 28px clamp(20px, 5vw, 32px) 26px; border-radius: 14px 14px 0 0;
  -webkit-mask: radial-gradient(circle var(--notch) at 0 100%, transparent 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle var(--notch) at 100% 100%, transparent 97%, #000) right / 51% 100% no-repeat;
  mask: radial-gradient(circle var(--notch) at 0 100%, transparent 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle var(--notch) at 100% 100%, transparent 97%, #000) right / 51% 100% no-repeat;
}
.waybill-top:only-child { border-radius: 14px; -webkit-mask: none; mask: none; }
.waybill-stub {
  position: relative; padding: 20px clamp(20px, 5vw, 32px) 24px; border-radius: 0 0 14px 14px;
  -webkit-mask: radial-gradient(circle var(--notch) at 0 0, transparent 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle var(--notch) at 100% 0, transparent 97%, #000) right / 51% 100% no-repeat;
  mask: radial-gradient(circle var(--notch) at 0 0, transparent 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle var(--notch) at 100% 0, transparent 97%, #000) right / 51% 100% no-repeat;
}
.waybill-stub::before { content: ""; position: absolute; left: 18px; right: 18px; top: 0; border-top: 2px dashed var(--line); }
.auth h1 { font: 800 32px/1.12 var(--display); letter-spacing: -.028em; }
.auth-lede { margin: 6px 0 22px; color: var(--ink-2); }
.auth-switch { margin-top: 16px; text-align: center; font-size: 15px; color: var(--ink-2); }
.demo-row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; font-size: 14.5px; }
.demo-row span { color: var(--ink-3); }
.demo-row code { overflow-wrap: anywhere; text-align: right; }
.stub-title { font-weight: 600; margin-bottom: 6px; }
.waybill-stub .btn { margin-top: 12px; }
.auth-foot { max-width: 440px; font-size: 14px; line-height: 1.4; color: var(--ink-3); text-align: center; }

/* Kerangka dashboard */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.side {
  position: sticky; top: 0; height: 100vh; height: 100dvh;
  display: flex; flex-direction: column; gap: 24px; padding: 20px 14px;
  background: #fff; border-right: 1px solid var(--line);
}
.side .brand { padding-inline: 8px; }
.side-nav { display: grid; gap: 2px; }
.side-nav a {
  display: flex; align-items: center; gap: 10px; padding: 10px;
  border-radius: 8px; color: var(--ink-2); font-weight: 500; text-decoration: none;
}
.side-nav a:hover { background: var(--mist); color: var(--ink); }
.side-nav a[aria-current="page"] { background: var(--cobalt-soft); color: var(--cobalt-deep); font-weight: 600; }
.side-nav svg { width: 18px; height: 18px; flex: none; }
.side-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); min-width: 0; }
.side-user { font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
.side-mail { font-size: 13.5px; color: var(--ink-3); overflow-wrap: anywhere; }
.side-actions { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 8px; }

.main { min-width: 0; padding: clamp(20px, 3vw, 36px); }
.main-inner { max-width: 1120px; margin-inline: auto; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px 20px; margin-bottom: 22px; }
.page-head h1 { font: 800 clamp(28px, 3vw, 36px)/1.12 var(--display); letter-spacing: -.028em; }
.page-head p { color: var(--ink-2); margin-top: 3px; }
.dummy-tag { padding: 5px 9px 3px; background: var(--hivis-soft); border-radius: 5px; font: 500 12.5px/1.2 var(--mono); }

.card { min-width: 0; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 0 0 1px var(--line); }
.card-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 14px; }
.card h2 { font: 800 19px/1.25 var(--display); letter-spacing: -.012em; }
.card-sub { font-size: 14px; color: var(--ink-3); }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
.tile-label { font-size: 14.5px; color: var(--ink-2); }
.tile-value { margin-top: 2px; font: 800 34px/1.15 var(--display); letter-spacing: -.025em; }
.tile-note { font-size: 14px; color: var(--ink-3); }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 14px; margin-bottom: 14px; }

/* Grafik batang */
.chart { position: relative; height: 240px; padding: 0 0 24px 44px; }
.gridline { position: absolute; left: 44px; right: 0; border-top: 1px solid var(--line); }
.gridline span { position: absolute; right: 100%; top: -9px; margin-right: 8px; font: 400 12px/1.5 var(--mono); color: var(--ink-3); }
.bars { position: relative; display: flex; height: 100%; }
.bar-col { position: relative; flex: 1 1 0; min-width: 0; display: flex; align-items: flex-end; justify-content: center; padding: 0 1px; background: none; border: 0; border-radius: 4px; }
.bar-col:hover { background: var(--mist); }
.bar-col:focus-visible { outline-offset: 0; }
.bar { display: block; width: min(100%, 26px); border-radius: 4px 4px 0 0; background: var(--cobalt); }
.bar-x { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); padding-top: 6px; font: 400 12px/1.4 var(--mono); color: var(--ink-3); white-space: nowrap; }
.tip {
  position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, -100%);
  padding: 7px 10px; background: var(--ink); border-radius: 6px; color: #fff; font-size: 13.5px; line-height: 1.3; white-space: nowrap;
}
.tip strong { display: block; font: 700 14px/1.3 var(--mono); }
.table-toggle { margin-top: 12px; font-size: 14.5px; color: var(--ink-2); }
.table-toggle summary { cursor: pointer; }
.table-toggle .table-wrap { margin-top: 8px; max-height: 220px; overflow: auto; }

.dist { display: grid; gap: 11px; }
.dist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; font-size: 14.5px; }
.dist-val { font: 600 14px/1.5 var(--mono); }
.dist-track { grid-column: 1 / -1; height: 8px; }
.dist-bar { display: block; height: 100%; min-width: 4px; border-radius: 0 4px 4px 0; background: var(--cobalt); }

/* Tabel */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; line-height: 1.4; }
th { padding: 7px 14px 7px 0; text-align: left; font-size: 13.5px; font-weight: 600; color: var(--ink-3); border-bottom: 1px solid #C4CBDE; white-space: nowrap; }
td { padding: 10px 14px 10px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
td:last-child, th:last-child { padding-right: 0; }
.num { text-align: right; font-family: var(--mono); font-size: 14px; }
.resi-link { padding: 2px 0; background: none; border: 0; color: var(--cobalt); font: 600 14px/1.4 var(--mono); text-decoration: underline; text-underline-offset: 3px; }
.resi-link:hover { color: var(--cobalt-deep); }
.pill { display: inline-block; padding: 4px 10px 3px; border-radius: 999px; background: var(--get-bg); color: var(--get); font-weight: 600; font-size: 13.5px; line-height: 1.3; }
.pill.is-done { background: var(--post-bg); color: var(--post); }
.pill.is-fail { background: var(--delete-bg); color: var(--delete); }
.method { display: inline-block; min-width: 62px; padding: 5px 7px 3px; border-radius: 4px; background: var(--get); color: #fff; font: 700 12px/1 var(--mono); text-align: center; }
.method[data-m="POST"] { background: var(--post); }
.method[data-m="PUT"] { background: var(--put); }
.method[data-m="DELETE"] { background: var(--delete); }
.http { padding: 4px 7px 2px; border-radius: 4px; background: var(--post-bg); color: var(--post); font: 700 12.5px/1 var(--mono); }
.http.is-error { background: var(--delete-bg); color: var(--delete); }
.path { font: 500 14px/1.4 var(--mono); }

.toolbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin-bottom: 14px; }
.toolbar .field { flex: 1 1 200px; max-width: 320px; margin: 0; }
.toolbar .input { height: 42px; }
.segment { display: inline-flex; padding: 3px; background: var(--mist); border-radius: 8px; }
.segment button { padding: 7px 14px; background: none; border: 0; border-radius: 6px; font-weight: 500; font-size: 14.5px; color: var(--ink-2); }
.segment button[aria-pressed="true"] { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.empty { padding: 36px 12px; text-align: center; color: var(--ink-2); }
.empty strong { display: block; font: 800 20px/1.25 var(--display); color: var(--ink); }

/* API key */
.key-box { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.key-value { flex: 1 1 280px; min-width: 0; padding: 12px 13px 10px; background: var(--mist); border-radius: 8px; font: 500 15px/1.35 var(--mono); overflow-wrap: anywhere; }
.meter { height: 10px; margin-top: 10px; background: var(--mist); border-radius: 5px; overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: 5px; background: var(--cobalt); }
.snippet { padding: 14px; overflow-x: auto; background: var(--ink); border-radius: 8px; color: #D6DEF5; font: 400 13.5px/1.6 var(--mono); }
.stack { display: grid; gap: 14px; }

/* Dialog */
dialog { width: min(520px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 0; border-radius: 14px; color: var(--ink); box-shadow: 0 24px 60px rgba(14, 26, 58, .3); }
dialog::backdrop { background: rgba(14, 26, 58, .5); }
.dialog-body { padding: 24px; }
.dialog-body h2 { font: 800 24px/1.2 var(--display); letter-spacing: -.02em; }
.dialog-lede { margin: 6px 0 18px; color: var(--ink-2); }
.dialog-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.d-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; }
.d-resi { font: 700 19px/1.3 var(--mono); }
.d-route { margin-top: 8px; font: 800 24px/1.2 var(--display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.d-meta { margin-top: 2px; font-size: 14.5px; color: var(--ink-3); }
.timeline { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.timeline li { position: relative; padding: 0 0 14px 22px; }
.timeline li:last-child { padding-bottom: 0; }
.timeline li::before { content: ""; position: absolute; left: 0; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: #fff; border: 2px solid var(--field); }
.timeline li::after { content: ""; position: absolute; left: 4px; top: 20px; bottom: -3px; width: 1px; background: var(--line); }
.timeline li:last-child::after { display: none; }
.timeline li:first-child::before { background: var(--cobalt); border-color: var(--cobalt); }
.tl-note { font-weight: 600; line-height: 1.35; }
.tl-sub { font-size: 14px; color: var(--ink-3); }

.toast {
  position: fixed; left: 50%; bottom: 22px; z-index: 50; transform: translateX(-50%);
  max-width: calc(100vw - 32px); padding: 10px 16px; background: var(--ink); border-radius: 8px; color: #fff; font-weight: 500;
}

@media (max-width: 1040px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 800px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; gap: 10px; padding: 12px 16px 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .side .brand { padding-inline: 0; }
  .side-nav { display: flex; overflow-x: auto; gap: 4px; margin-inline: -4px; padding: 2px 4px; }
  .side-nav a { flex: none; padding: 8px 10px; }
  .side-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 0; padding: 8px 0 0; }
  .side-mail { display: none; }
  .side-actions { margin-top: 0; flex: none; }
  .main { padding: 18px 16px 28px; }
}
@media (max-width: 420px) {
  .tile-value { font-size: 28px; }
  .card { padding: 16px; }
  .chart { padding-left: 38px; }
  .gridline { left: 38px; }
  .two { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .dialog-body { padding: 20px 18px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<noscript><p style="padding:12px 16px;background:#FFF5B8">Halaman ini membutuhkan JavaScript. Aktifkan JavaScript untuk masuk dan membuka dashboard.</p></noscript>
<div id="app"></div>
<dialog id="dialog"><div class="dialog-body" id="dialogBody"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';

  /*
   * Semua data di halaman ini simulasi. Akun, sesi, dan pengiriman disimpan
   * di localStorage browser, jadi autentikasi di sini bukan keamanan sungguhan.
   * Saat backend tersedia, ganti fungsi di bagian "Akun" dengan panggilan API.
   */
  var BASE_URL = 'https://api-d4ti.example/v1';
  var DEMO = { name: 'Akun Demo', email: 'demo@d4ti.test', password: 'd4ti1234' };

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  var num = new Intl.NumberFormat('id-ID');

  /* ---------- Penyimpanan ---------- */
  var memory = {};
  var store = {
    get: function (key, fallback) {
      var raw = null;
      try { raw = localStorage.getItem('d4ti.' + key); } catch (e) { raw = null; }
      if (raw === null && key in memory) raw = memory[key];
      if (raw === null || raw === undefined) return fallback;
      try { return JSON.parse(raw); } catch (e) { return fallback; }
    },
    set: function (key, value) {
      var raw = JSON.stringify(value);
      memory[key] = raw;
      try { localStorage.setItem('d4ti.' + key, raw); } catch (e) { /* tetap jalan dari memori */ }
    },
    remove: function (key) {
      delete memory[key];
      try { localStorage.removeItem('d4ti.' + key); } catch (e) { /* abaikan */ }
    }
  };

  /* ---------- Akun ---------- */
  function hashPassword(email, password) {
    var text = email + ':' + password;
    if (window.crypto && crypto.subtle && window.TextEncoder) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
        return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      });
    }
    var h = 5381;
    for (var i = 0; i < text.length; i++) h = ((h * 33) ^ text.charCodeAt(i)) >>> 0;
    return Promise.resolve('weak-' + h.toString(16));
  }
  function currentUser() { return store.get('session', null); }
  function startSession(user) { store.set('session', { name: user.name, email: user.email }); }

  function registerUser(name, email, password) {
    var users = store.get('users', []);
    if (email === DEMO.email || users.some(function (u) { return u.email === email; })) {
      return Promise.resolve({ ok: false });
    }
    return hashPassword(email, password).then(function (hash) {
      var user = { name: name, email: email, hash: hash };
      users.push(user);
      store.set('users', users);
      startSession(user);
      return { ok: true };
    });
  }
  function loginUser(email, password) {
    if (email === DEMO.email && password === DEMO.password) {
      startSession(DEMO);
      return Promise.resolve(true);
    }
    var user = store.get('users', []).filter(function (u) { return u.email === email; })[0];
    if (!user) return Promise.resolve(false);
    return hashPassword(email, password).then(function (hash) {
      if (hash !== user.hash) return false;
      startSession(user);
      return true;
    });
  }

  /* ---------- Data simulasi ---------- */
  var LABELS = {
    created: 'Dibuat', picked_up: 'Dijemput', in_transit: 'Dalam perjalanan',
    out_for_delivery: 'Dibawa kurir', delivered: 'Terkirim', failed: 'Gagal kirim'
  };

      '<div class="d-route">' + esc(s.origin) + ' → ' + esc(s.destination) + '</div><div class="d-meta">Layanan ' + esc(s.service) + '</div>' +
      '<ol class="timeline" aria-label="Riwayat perjalanan">' + s.checkpoints.map(function (c) {
        return '<li><div class="tl-note">' + esc(c.note) + '</div><div class="tl-sub">' + esc(c.location) + ' · ' + when(c.time) + '</div></li>';
      }).join('') + '</ol>' +
      '<div class="dialog-actions"><button class="btn" type="button" data-action="close-dialog">Tutup</button>' +
      (next ? '<button class="btn btn-primary" type="button" data-action="advance" data-resi="' + esc(s.resi) + '">Ubah ke ' + LABELS[next] + '</button>' : '') + '</div>'
    );
  }
  function nextStatus(status) {
    if (status === 'failed') return 'out_for_delivery';
    return FLOW[FLOW.indexOf(status) + 1] || null;
  }
  function advance(resi) {
    var list = shipments();
    var s = list.filter(function (x) { return x.resi === resi; })[0];
    var next = s && nextStatus(s.status);
    if (!next) return;
    s.status = next;
    s.checkpoints.unshift(checkpointFor(next, s, new Date().toISOString()));
    store.set('shipments', list);
    addLog('PUT', '/shipments/' + resi + '/status', 200, 96);
    render();
    dialogShipment(resi);
    toast('Status diperbarui ke ' + LABELS[next]);
  }
  function dialogNewShipment() {
    openDialog(
      '<h2>Buat pengiriman</h2><p class="dialog-lede">Resi terbit otomatis setelah pengiriman dibuat.</p>' +
      '<form id="shipmentForm" novalidate><div class="two">' +
        field('origin', 'Kota asal', 'text', 'off') + field('destination', 'Kota tujuan', 'text', 'off') +
      '</div><div class="field"><label class="field-label" for="service">Layanan</label><select class="input" id="service"><option>Reguler</option><option>Kilat</option><option>Kargo</option></select></div>' +
      '<div class="dialog-actions"><button class="btn" type="button" data-action="close-dialog">Batal</button><button class="btn btn-primary" type="submit">Buat pengiriman</button></div></form>'
    );
  }
  function submitShipment(form) {
    var origin = form.origin.value.trim(), destination = form.destination.value.trim();
    var valid = setErrors({ origin: origin ? '' : 'Masukkan kota asal.', destination: destination ? '' : 'Masukkan kota tujuan.' });
    if (!valid) return;
    var list = shipments();
    var d = new Date();
    var prefix = 'D4TI-' + String(d.getFullYear()).slice(-2) + String(d.getMonth() + 1).padStart(2, '0') + '-';
    var n = 200, resi;
    do { n += 1; resi = prefix + String(n).padStart(4, '0'); } while (list.some(function (s) { return s.resi === resi; }));
    var s = { resi: resi, status: 'created', service: form.service.value, origin: origin, destination: destination };
    s.checkpoints = [checkpointFor('created', s, d.toISOString())];
    list.push(s);
    store.set('shipments', list);
    addLog('POST', '/shipments', 201, 128);
    closeDialog();
    render();
    toast('Pengiriman ' + resi + ' dibuat');
  }
  function dialogConfirm(title, text, action, label) {
    openDialog('<h2>' + title + '</h2><p class="dialog-lede">' + text + '</p><div class="dialog-actions">' +
      '<button class="btn" type="button" data-action="close-dialog">Batal</button>' +
      '<button class="btn btn-danger" type="button" data-action="' + action + '">' + label + '</button></div>');
  }

  /* ---------- Rute ---------- */
  var loginNotice = '';
  function go(hash) {
    if (location.hash === hash) render();
    else location.hash = hash;
  }
  function render() {
    var hash = location.hash.replace(/^#/, '') || '/masuk';
    var user = currentUser();
    var app = $('app');
    var title = 'API Tracking D4TI';

    if (hash.indexOf('/dashboard') === 0) {
      if (!user) {
        loginNotice = 'Masuk dulu untuk membuka dashboard.';
        location.replace('#/masuk');
        return;
      }
      var sub = hash.slice('/dashboard'.length);
      var views = { '': [viewOverview, 'Ringkasan'], '/pengiriman': [viewShipments, 'Pengiriman'], '/log': [viewLogs, 'Log request'], '/api-key': [viewKey, 'API key'] };
      var view = views[sub] || views[''];
      app.innerHTML = shell(views[sub] ? sub : '', view[0]());
      renderShipmentTable();
      renderLogTable();
      title = view[1] + ' · API Tracking D4TI';
    } else if (user) {
      location.replace('#/dashboard');
      return;
    } else if (hash === '/daftar') {
      app.innerHTML = viewRegister();
      title = 'Daftar · API Tracking D4TI';
    } else {
      app.innerHTML = viewLogin(loginNotice);
      loginNotice = '';
      title = 'Masuk · API Tracking D4TI';
    }
    document.title = title;
  }
  function renderAndFocus() {
    render();
    var h1 = document.querySelector('#app h1');
    if (h1) h1.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  var toastTimer;
  function toast(text) {
    var el = $('toast');
    el.textContent = text;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 2600);
  }
  function copyText(text) {
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      toast(ok ? 'API key tersalin' : 'Gagal menyalin. Tampilkan key, lalu salin manual.');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('API key tersalin'); }, fallback);
    } else {
      fallback();
    }
  }

  /* ---------- Aksi ---------- */
  var actions = {
    'toggle-password': function (btn) {
      var input = $(btn.dataset.target);
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Sembunyikan' : 'Tampilkan';
      btn.setAttribute('aria-pressed', String(show));
    },
    'demo-login': function () { startSession(DEMO); go('#/dashboard'); },
    'logout': function () { store.remove('session'); keyVisible = false; go('#/masuk'); },
    'ask-reset': function () {
      dialogConfirm('Reset data dummy?', 'Pengiriman, log, dan API key kembali ke kondisi awal. Akun kamu tetap ada.', 'reset', 'Reset data');
    },
    'reset': function () {
      ['shipments', 'logs', 'apiKey'].forEach(store.remove);
      closeDialog();
      render();
      toast('Data dummy direset');
    },
    'open-shipment': function (btn) { dialogShipment(btn.dataset.resi); },
    'new-shipment': dialogNewShipment,
    'advance': function (btn) { advance(btn.dataset.resi); },
    'close-dialog': closeDialog,
    'log-filter': function (btn) {
      filters.log = btn.dataset.value;
      document.querySelectorAll('.segment button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b === btn));
      });
      renderLogTable();
    },
    'toggle-key': function (btn) {
      keyVisible = !keyVisible;
      $('keyValue').textContent = maskedKey();
      btn.textContent = keyVisible ? 'Sembunyikan' : 'Tampilkan';
      btn.setAttribute('aria-pressed', String(keyVisible));
    },
    'copy-key': function () { copyText(apiKey()); },
    'ask-rotate': function () {
      dialogConfirm('Buat ulang API key?', 'Key lama langsung berhenti berlaku. Aplikasi yang memakainya perlu diganti ke key baru.', 'rotate', 'Buat ulang');
    },
    'rotate': function () {
      store.set('apiKey', randomKey());
      closeDialog();
      render();
      toast('API key baru dibuat');
    }
  };
  document.addEventListener('click', function (ev) {
    var btn = ev.target.closest('[data-action]');
    if (btn && actions[btn.dataset.action]) actions[btn.dataset.action](btn);
  });
  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var handlers = { loginForm: submitLogin, registerForm: submitRegister, shipmentForm: submitShipment };
    if (handlers[ev.target.id]) handlers[ev.target.id](ev.target);
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'q') { filters.q = ev.target.value; renderShipmentTable(); }
    if (ev.target.id === 'statusFilter') { filters.status = ev.target.value; renderShipmentTable(); }
  });

  function showTip(col) {
    var chart = $('chart'), tip = $('tip');
    if (!chart || !tip) return;
    var c = chart.getBoundingClientRect(), r = col.getBoundingClientRect(), bar = col.querySelector('.bar').getBoundingClientRect();
    tip.innerHTML = '<strong>' + esc(col.dataset.tipValue) + '</strong>' + esc(col.dataset.tipLabel);
    tip.hidden = false;
    var half = tip.offsetWidth / 2;
    var x = Math.min(Math.max(r.left + r.width / 2 - c.left, half), c.width - half);
    tip.style.left = x + 'px';
    tip.style.top = Math.max(bar.top - c.top - 6, tip.offsetHeight) + 'px';
  }
  function hideTip() { var tip = $('tip'); if (tip) tip.hidden = true; }
  ['pointerover', 'focusin'].forEach(function (type) {
    document.addEventListener(type, function (ev) {
      var col = ev.target.closest && ev.target.closest('.bar-col');
      if (col) showTip(col);
    });
  });
  ['pointerout', 'focusout'].forEach(function (type) {
    document.addEventListener(type, function (ev) {
      if (ev.target.closest && ev.target.closest('.bar-col')) hideTip();
    });
  });

  window.addEventListener('hashchange', renderAndFocus);
  render();
})();
</script>
</body>
</html>
